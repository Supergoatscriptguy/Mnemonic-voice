# clio: the main speech model (~113M). 17 conformer blocks of 512, 8 heads of 64.
# the steps get set once the speed is measured (bin\train clio prof=1)
n_layer = 17
d_model = 512
n_head = 8
ffn = 1536              # swiglu hidden: gate and up are 1536 each
vocab = 1024
conv_kernel = 9
sub_channels = 256
n_mel = 80

data = datasets\shards\heavy-small, datasets\shards\heavy-medium, datasets\shards\voxpopuli
max_sec = 30
frames = 40960          # mel frames a micro-batch holds: 409.6 s of audio
maxb = 64
accum = 4               # micro-batches a step: ~27 minutes of audio
aug = 1                 # speed, reverb, noise, spec augment
stream = 1              # half the micro-batches with chunked attention
steps = 100000
lr = 1.5e-3
min_lr = 0.02
warmup = 3000
wd = 1e-3
clip = 1.0
b2 = 0.98
fast = 1
bf16 = 1
seed = 1

log_every = 20
val_every = 1000
val_batches = 100
save_every = 1000
keep = 3
