# melete: the small proof model (~21M). does the whole pipeline learn?
n_layer = 12
d_model = 256
n_head = 4              # heads of 64
ffn = 768               # swiglu hidden: gate and up are 768 each
vocab = 1024
conv_kernel = 9
sub_channels = 256
n_mel = 80

data = datasets\shards\heavy-small
max_sec = 30
frames = 40960          # mel frames a micro-batch holds: 409.6 s of audio
maxb = 64
accum = 2               # micro-batches a step: ~13 minutes of audio
steps = 20000
lr = 1.5e-3
min_lr = 0.05           # of lr, where the cosine ends
warmup = 1000
wd = 1e-3
clip = 1.0
b2 = 0.98
fast = 1                # gemm_tc and bf16 (attention is the naive kernels for now)
bf16 = 1
seed = 1

log_every = 20
val_every = 500
val_batches = 100
save_every = 1000
keep = 3
