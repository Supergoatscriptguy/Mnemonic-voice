# cliocv: clio fine-tuned with common voice in the mix (many speakers, accents and
# mics) and the spontaneous set, plus mic-level gain. starts from clio's weights
n_layer = 17
d_model = 512
n_head = 8
ffn = 1536
vocab = 1024
conv_kernel = 9
sub_channels = 256
n_mel = 80

init = checkpoints\clio\step_00100000.ckpt
data = datasets\shards\heavy-small, datasets\shards\heavy-medium, datasets\shards\voxpopuli, datasets\shards\cv, datasets\shards\cv-spont
max_sec = 30
frames = 40960
maxb = 64
accum = 4
aug = 1
p_gain = 0.5            # half the clips -25..+5 dB, as quiet or hot mics give them
stream = 1
steps = 40000
lr = 5e-4               # a third of clio's peak: it's a fine-tune
min_lr = 0.02
warmup = 1000
wd = 1e-3
clip = 1.0
b2 = 0.98
fast = 1
bf16 = 1
seed = 2

log_every = 20
val_every = 1000
val_batches = 100
save_every = 1000
keep = 3
